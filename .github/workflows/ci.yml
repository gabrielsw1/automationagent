name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  testes:
    name: Lint e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      COPILOTO_SEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint e typecheck
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - name: Testes (modo simulado, sem chave do Claude)
        run: npm test
      - name: Build
        run: npm run build
